<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>minseokkim - Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
        }
    </style>
</head>

<body class="min-h-screen bg-white">

    <!-- Header -->
    <header class="pt-12 pb-8 px-6">
        <div class="max-w-4xl mx-auto text-center">
            <h1 class="text-sm tracking-wide mb-6">minseokkim</h1>
            <nav class="flex justify-center gap-3 text-sm">
                <a href="#projects" class="hover:opacity-60 transition-opacity">Project List</a>
                <span>/</span>
                <a href="#about" class="hover:opacity-60 transition-opacity">About</a>
                <span>/</span>
                <a href="#contact" class="hover:opacity-60 transition-opacity">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="px-6 py-12">
        <div class="max-w-3xl mx-auto">

            <!-- Featured Image Slider -->
            <div class="mb-6 relative w-full h-[500px] bg-white flex items-center justify-center">

                <!-- 이미지 -->
                <img
                    id="slider"
                    src="On a Spring Day of Passing Whispers_west elevation.jpg"
                    alt="On a Spring Day of Passing Whispers"
                    class="max-w-full max-h-full object-contain transition-opacity duration-500 opacity-100"
                />

                <!-- 왼쪽 클릭 영역 -->
                <div onclick="prevImage()"
                     class="absolute left-0 top-0 w-[30%] h-full cursor-w-resize"></div>

                <!-- 중앙 클릭 영역 (프로젝트 이동) -->
                <a href="On%20a%20Spring%20Day%20of%20Passing%20Whispers.html"
                   class="absolute left-[30%] top-0 w-[40%] h-full cursor-pointer"></a>

                <!-- 오른쪽 클릭 영역 -->
                <div onclick="nextImage()"
                     class="absolute right-0 top-0 w-[30%] h-full cursor-e-resize"></div>

            </div>

            <!-- Caption -->
            <div class="text-center">
                <p class="text-sm mb-1">On a Spring Day of Passing Whispers</p>
                <p class="text-sm">Drawing and rendering workshop project, 2026</p>
            </div>

        </div>
    </main>

    <!-- JavaScript -->
    <script>
        const images = [
            "On a Spring Day of Passing Whispers_west elevation.jpg",
            "On a Spring Day of Passing Whispers_passage.jpg",
            "On a Spring Day of Passing Whispers_backyard.jpg"
        ];

        let currentIndex = 0;

        function showImage() {
            const img = document.getElementById("slider");

            img.style.opacity = 0;

            setTimeout(() => {
                img.src = images[currentIndex];
                img.style.opacity = 1;
            }, 300);
        }

        function nextImage() {
            currentIndex = (currentIndex + 1) % images.length;
            showImage();
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            showImage();
        }
    </script>

</body>
</html>
