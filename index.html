<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>minseokkim</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
        }

        img {
            -webkit-user-drag: none;
            user-drag: none;
        }

        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>

<body class="min-h-screen bg-white no-select">

<script>
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('dragstart', e => e.preventDefault());
document.addEventListener('drop', e => e.preventDefault());
document.addEventListener('copy', e => e.preventDefault());

document.addEventListener('keydown', function(e) {
    if (e.ctrlKey) {
        const blocked = ['c', 's', 'u'];
        if (blocked.includes(e.key.toLowerCase())) {
            e.preventDefault();
        }
    }
});
</script>

<header class="fixed top-0 left-0 w-full h-[12vh] px-6 bg-white z-50 flex items-center">
    <div class="max-w-4xl mx-auto text-center w-full">
        <h1 class="text-base tracking-wide mb-2">minseokkim</h1>
        <nav class="flex justify-center gap-3 text-base">
            <a href="#" class="hover:opacity-60 transition-opacity">Project List</a>
            <span>/</span>
            <a href="#" class="hover:opacity-60 transition-opacity">About</a>
            <span>/</span>
            <a href="#" class="hover:opacity-60 transition-opacity">Contact</a>
        </nav>
    </div>
</header>

<main class="px-6 pt-[12vh] pb-12">
    <div class="max-w-3xl mx-auto">

        <!-- 🔥 여기만 변경됨 -->
        <div class="mb-6 relative w-full h-[65vh] bg-white flex items-center justify-center">

            <img
                id="slider"
                src="poster_01.jpg"
                class="max-w-full max-h-full object-contain transition-opacity duration-500 opacity-100"
            />

            <div onclick="prevImage()" class="absolute left-0 top-0 w-[30%] h-full cursor-w-resize"></div>

            <div onclick="handleCenterClick()" class="absolute left-[30%] top-0 w-[40%] h-full cursor-pointer"></div>

            <div onclick="nextImage()" class="absolute right-0 top-0 w-[30%] h-full cursor-e-resize"></div>

        </div>

        <div class="text-center">
            <p id="caption-title" class="text-base mb-1 italic">On a Spring Day of Passing Whispers</p>
            <p id="caption-sub" class="text-base">Konkuk, Drawing and rendering workshop project, 2026</p>
        </div>

    </div>
</main>

<script>
const images = [
    "poster_01.jpg",
    "poster_02.jpg"
];

const captions = [
    {
        title: "On a Spring Day of Passing Whispers",
        sub: "Konkuk, Drawing and rendering workshop project, 2026"
    },
    {
        title: "On a Summer Day of Wearing AIRism",
        sub: "Yonsei, Rendering and collage workshop project, 2026"
    }
];

let currentIndex = 0;

function showImage() {
    const img = document.getElementById("slider");
    const title = document.getElementById("caption-title");
    const sub = document.getElementById("caption-sub");

    img.style.opacity = 0;

    setTimeout(() => {
        img.src = images[currentIndex];
        title.textContent = captions[currentIndex].title;
        sub.textContent = captions[currentIndex].sub;
        img.style.opacity = 1;
    }, 300);
}

function nextImage() {
    currentIndex = (currentIndex + 1) % images.length;
    showImage();
}

function prevImage() {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    showImage();
}

function handleCenterClick() {
    if (currentIndex === 0) {
        window.location.href = "spring.html";
    }
}
</script>

</body>
</html>
